[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lending-club-rag"
version = "0.1.0"
description = "Reproducible Lending Club financial data mart, ML, and RAG API workflow"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "scikit-learn>=1.2",
  "joblib>=1.3",
  "fastapi>=0.100",
  "uvicorn>=0.23",
]

[project.scripts]
lending-club = "lending_club.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

